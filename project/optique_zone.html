<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style/style.css">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <title>Portfolio :: OptiqueZone</title>
</head>

<body>
  <section class="single-work">
    <div class="container">
      <div class="left">
        <a class="back" href="/portfolio.html">&#x25c0; Back to Portfolio</a>
        <h1>OptiqueZone</h1>

        <ul class="detail">
          <li>
            <p><span>Project Type:</span></p>
            <p>
              Web Design<br />
              Web Development<br />
              SEO
            </p>
          </li>
          <li>
            <p><span>Completion:</span> December 2015</p>
          </li>
        </ul>
        <a class="link" href="http://optiquezone.com/" target="_blank">Visit Site</a>
      </div>

      <div class="right">
        <div style="text-align: center;">
          <img src="../img/project/optique_zone.png" alt="OptiqueZone" />
        </div>
      </div>

    </div>
  </section>

  <footer id="colophon" class="site-footer">
    <p>
      Copyright © 2026 illusionistDev.<br />All rights reserved.
    </p>
  </footer><!-- #colophon -->

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      gsap.from('.left *', {
        scrollTrigger: {
          trigger: '.left',
          start: 'top 80%',
          toggleActions: 'play none none reverse',
        },
        opacity: 0,
        x: -20,
        duration: .5,
      });

      gsap.from('.right', {
        scrollTrigger: {
          trigger: '.left',
          start: 'top 80%',
          toggleActions: 'play none none reverse',
        },
        opacity: 0,
        delay: .3,
        y: -30,
        duration: .5,
      });
    })
  </script>
</body>

</html>
